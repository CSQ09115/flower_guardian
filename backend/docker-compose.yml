services:
  db:
    image: postgres:16-alpine
    container_name: flower_guardian_db
    environment:
      POSTGRES_USER: flower_user
      POSTGRES_PASSWORD: flower_password
      POSTGRES_DB: flower_guardian
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flower_user -d flower_guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: flower_guardian_backend
    container_name: flower_guardian_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://flower_user:flower_password@db:5432/flower_guardian
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - plant_images:/app/static/plants
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  plant_images:
