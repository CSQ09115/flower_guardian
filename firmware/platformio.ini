; 护花使者 ESP32-S3 固件工程配置
; PlatformIO 工程配置文件：告诉它用什么芯片、什么框架、怎么编译烧录
;
; 硬件：ESP32-S3-N16R8（16MB Flash + 8MB PSRAM）

[env:flower_guardian]
; 开发平台：乐鑫 ESP32 系列
platform = espressif32
; 开发板型号（N16R8 兼容官方 DevKitC-1 引脚定义）
board = esp32-s3-devkitc-1
; 开发框架：Arduino（上手最快，库资源最丰富）
framework = arduino

; ---- N16R8 专属配置：告诉编译器我们的 Flash 和 PSRAM 是什么规格 ----
; qio_opi = Flash 四线读写(QSPI) + PSRAM 八线读写(Octal SPI)，这是 N16R8 的硬件设计
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
; Flash 有 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; 启用 PSRAM（8MB），后面跑语音 AI 必须开这个
build_flags =
    -DBOARD_HAS_PSRAM

; 串口监视器波特率（电脑和板子"对话"的速度，两边要一致）
monitor_speed = 115200
; 烧录速度（原生 USB，快）
upload_speed = 921600
